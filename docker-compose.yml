services:
  siamtel_web:
    build:
      context: .
      dockerfile: php.dockerfile
    container_name: siamtel_web
    restart: unless-stopped
    depends_on:
      - siamtel_db
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - .:/var/www/html
    develop:
      watch:
        - action: sync
          path: .
          target: /var/www/html
          ignore:
            - vendor/
            - .git/
        - action: rebuild
          path: ./php.dockerfile
        - action: rebuild
          path: ./composer.json
    environment:
      - DB_HOST=siamtel_db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

  siamtel_db:
    image: mariadb:10.11
    container_name: siamtel_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - siamtel_mariadb_data:/var/lib/mysql

  siamtel_pma:
    image: phpmyadmin:latest
    container_name: siamtel_pma
    restart: unless-stopped
    depends_on:
      - siamtel_db
    environment:
      PMA_HOST: siamtel_db
      PMA_PORT: 3306
    ports:
      - "${PMA_PORT}:80"

volumes:
  siamtel_mariadb_data:
