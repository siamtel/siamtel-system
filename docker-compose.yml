services:
  siamtel_web:
    image: php:8.2-apache
    container_name: siamtel_web
    restart: "no"
    working_dir: /var/www/html
    depends_on:
      - siamtel_db
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./html/:/var/www/html:Z
      - ./config-available/:/etc/apache2/conf-avialable:Z
    command:
      - sh
      - -c
      - |
        docker-php-ext-install pdo pdo_mysql mysqli && \
        apt-get update && apt-get install -y \
        libfreetype-dev \
        libjpeg62-turbo-dev \
        libpng-dev \
        libicu-dev \
        libbz2-dev \
        libzip-dev \
        libldap2-dev \
        git \
        unzip \
        && docker-php-ext-configure gd --with-freetype --with-jpeg \
        && docker-php-ext-install -j$(nproc) gd intl bz2 zip ldap exif \
        && apt-get clean \
        && rm -rf /var/lib/apt/lists/* && \
        a2enmod rewrite && \
        sed -ri 's!/var/www/html!/var/www/html/public!g' \
        /etc/apache2/sites-available/000-default.conf && \
        cp $$PHP_INI_DIR/php.ini-development $$PHP_INI_DIR/php.ini && \
        sed -i 's/session.cookie_httponly =/session.cookie_httponly = on/g' \
        $$PHP_INI_DIR/php.ini && \
        apache2-foreground
    environment:
      - DB_HOST=siamtel_db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

  siamtel_db:
    image: mariadb:10.11
    container_name: siamtel_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - siamtel_mariadb_data:/var/lib/mysql

  siamtel_pma:
    image: phpmyadmin:latest
    container_name: siamtel_pma
    restart: unless-stopped
    depends_on:
      - siamtel_db
    environment:
      PMA_HOST: siamtel_db
      PMA_PORT: 3306
    ports:
      - "${PMA_PORT}:80"

volumes:
  siamtel_mariadb_data:
